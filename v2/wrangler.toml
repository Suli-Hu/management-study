# Cloudflare Pages + D1 配置
# 部署：pnpm run build && wrangler pages deploy dist --project-name=management-study-v2
#
# D1 binding 在 W1.3 设计 schema 后填上 database_id

name = "management-study-v2"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# === D1 数据库（KP 数据 + 用户数据） ===
# 创建命令：wrangler d1 create management-study-v2
# 创建后把返回的 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "management-study-v2"
database_id = "4e236c30-cf6f-40f3-8bbc-b6b78444c797"

# === 环境变量（非 secret） ===
[vars]
ENVIRONMENT = "production"
SITE_NAME = "全学科学习笔记"
RESEND_FROM = "onboarding@resend.dev"
APP_URL = "https://management-study-v2.pages.dev"
# 管理员邮箱（逗号分隔）—— 只有这些邮箱登录后 locals.isAdmin = true，
# 可以编辑/删除 KP（write 权限）。其他用户只能 read。
ADMIN_EMAILS = "husuli0623@gmail.com"

# 认证模式开关（v0.2.9 起）：
#   "password" —— 考试期：2 个硬编码密码（123 访客 / 邮箱 admin），靠 secrets 注入
#   "email"    —— 正式期：magic link + 6-digit code（v0.2.5~7 实现）
# 考完切回 "email" + 删 ADMIN_PASSWORD/GUEST_PASSWORD secrets 即可
AUTH_MODE = "email"

# password 模式下，访客共用这条 user 记录（所有 123 登录指向同一 user_id）
GUEST_EMAIL = "guest@local"

# v0.4.33 邀请码登录（无需邮箱）：输 INVITE_CODE_GUEST → 共用 INVITE_GUEST_EMAIL user → 全学科 guest 视角
# 共用 user_id：所有邀请码登录指向同一 user（无 user_progress / user_note 区分），便利分享只读
INVITE_CODE_GUEST = "123"
INVITE_GUEST_EMAIL = "invite-guest@anytime"

# v0.4.1 编辑器：GitHub Contents API 目标仓库
GITHUB_REPO = "Suli-Hu/management-study"

# === Secrets（在 CF Pages Dashboard 设，不写 wrangler.toml） ===
# - RESEND_API_KEY   —— magic link 发邮件 (v0.2.5 起, email 模式用)
# - SESSION_SECRET   —— 预留（CSRF / signed cookies）
# - ADMIN_PASSWORD   —— v0.2.9 password 模式 admin 密码
# - GUEST_PASSWORD   —— v0.2.9 password 模式 guest 密码
# - GITHUB_PAT       —— v0.4.1 编辑器写 data/*.json（fine-grained，仅 Contents R/W）
# - STRIPE_SECRET_KEY —— W3 付费时
