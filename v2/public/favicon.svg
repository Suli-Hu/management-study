<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <style>
    :root { --bg: #0a0a0a; --fg: #fafaf9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #fafaf9; --fg: #0a0a0a; }
    }
    .bg { fill: var(--bg); }
    .su {
      fill: var(--fg);
      font-family: "Kalam", "Trebuchet MS", "Verdana", system-ui, sans-serif;
      font-weight: 700;
      font-size: 52px;
      letter-spacing: -2.5px;
    }
  </style>
  <circle cx="50" cy="50" r="50" class="bg" />
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" class="su">SU</text>
</svg>
