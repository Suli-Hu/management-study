<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7.73 -2.07 71.92 71.92" width="256" height="256">
  <!-- v0.5.74 favicon 根据系统 dark mode 自动反色 — 否则深色 tab 看不见黑 mark。
       Chrome / Firefox / Safari 都支持 SVG 内 prefers-color-scheme（Edge ≥ 105 也支持）。
       老浏览器 fallback：var() resolve 失败 → stroke 用空 → 沿用 currentColor / black 退化。 -->
  <style>
    :root { --mark: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #fafaf9; }
    }
  </style>
  <path d="M 32 32 A 5.656000000000001 5.656000000000001 0 0 0 32 20.688 A 13.197333333333335 13.197333333333335 0 0 0 32 47.08266666666667 A 20.738666666666667 20.738666666666667 0 0 0 32 5.605333333333334 A 28.28 28.28 0 0 0 32 62.165333333333336" fill="none" stroke="var(--mark, #0a0a0a)" stroke-width="5.44" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
