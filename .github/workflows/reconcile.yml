name: D1 reconciliation

# 每日对账 git vs D1 — 防止 silent drift（webhook 失败 / D1 双写漏掉某条等）。
# 发现 drift → workflow fail → GitHub 自动给 repo owner 发 email。
# 修复方式：管理员调 POST /api/v1/sync-discipline/<discipline> 一键拉齐。

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 03:17 UTC = 12:17 JST，避开 deploy-v2.yml 高峰
  workflow_dispatch:        # 允许手动触发

concurrency:
  group: reconcile-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # 一个学科 drift 不影响其它学科继续对账
      matrix:
        discipline: [keiei, marketing, sociology]
    steps:
      - name: Reconcile ${{ matrix.discipline }}
        env:
          API_URL: https://study.sususu.org
          API_TOKEN: ${{ secrets.RECONCILE_API_TOKEN }}
        run: |
          if [[ -z "$API_TOKEN" ]]; then
            echo "::error::RECONCILE_API_TOKEN secret not set"
            exit 1
          fi
          echo "::group::Calling reconcile/${{ matrix.discipline }}"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Origin: $API_URL" \
            "$API_URL/api/v1/reconcile/${{ matrix.discipline }}")
          http_code=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          echo "$body" | jq . || echo "$body"
          echo "::endgroup::"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::reconcile endpoint returned HTTP $http_code (expected 200)"
            exit 1
          fi

          has_drift=$(echo "$body" | jq -r '.has_drift // false')
          total=$(echo "$body" | jq -r '.total_drift // 0')
          if [[ "$has_drift" == "true" ]]; then
            echo "::error::Drift detected in ${{ matrix.discipline }}: $total entity diff"
            echo "::notice::Fix: curl -X POST -H 'Authorization: Bearer \$TOKEN' -H 'Origin: $API_URL' $API_URL/api/v1/sync-discipline/${{ matrix.discipline }}"
            exit 1
          fi
          echo "::notice::${{ matrix.discipline }} clean (no drift)"
