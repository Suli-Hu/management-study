name: Learning-flow smoke

# data/ 或迁移脚本改动时跑，确保 "加 KP → sync → D1 → 删 KP → sync 回归" 流程没坏。
# 用本地 miniflare D1（--local），不触 CF secrets。
on:
  push:
    branches: [main]
    paths:
      - 'v2/data/**'
      - 'v2/scripts/test-learning-flow.ts'
      - 'v2/scripts/validate-data.ts'
      - 'v2/scripts/sync-to-d1.ts'
      - 'v2/scripts/lib/**'
      - 'v2/migrations/**'
      - 'v2/src/lib/schema.ts'
      - '.github/workflows/learning-flow-smoke.yml'
  pull_request:
    paths:
      - 'v2/data/**'
      - 'v2/migrations/**'
      - 'v2/scripts/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (local miniflare)
        run: pnpm exec wrangler d1 migrations apply management-study-v2 --local

      - name: Run learning-flow smoke test
        run: pnpm test:learning-flow
