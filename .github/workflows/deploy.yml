name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject commit SHA into cache-bust placeholders
        # index.html: rewrites ?v=__SHA__ on every script tag → unique URLs per
        #   deploy → browsers + SW can't reuse stale cached copies.
        # sw.js:     rewrites CACHE_VERSION = '__SHA__' → sw.js bytes change on
        #   every deploy → Chrome/Safari auto-detect SW update → new SW's
        #   activate step deletes every previous `ms-*` cache → client gets
        #   a clean slate on the next normal refresh (no manual unregister).
        run: |
          sed -i "s/__SHA__/${{ github.sha }}/g" Main/index.html
          sed -i "s/__SHA__/${{ github.sha }}/g" Main/sw.js

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message uses SHA (ASCII) to avoid Cloudflare API bug #11749:
          # Pages API truncates long multi-line UTF-8 commit messages at byte 380,
          # which splits multi-byte CJK chars and triggers "Invalid UTF-8" (code 8000111).
          command: pages deploy Main --project-name=management-study --branch=main --commit-dirty=true --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }}
