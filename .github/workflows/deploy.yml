name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      WORKER_URL: https://quiz-worker.husuli0623.workers.dev
      WORKER_AUTH_TOKEN: quiz_token_2026  # 也在 Main/js/utils.js 明文中，非 secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # "本次部署对应的 git commit 时间" — purge-stale 的 beforeTime，
      # 也是 client merge 的 DATA_DEPLOY_TIME 参照点。
      # 用 commit time 而非 deploy 完成时间，保护"部署进行中用户新编辑"的 overlay：
      # 这些编辑的 updatedAt > commit_time，会被保留。
      - name: Compute commit time (UTC ISO)
        id: ts
        run: |
          RAW='${{ github.event.head_commit.timestamp }}'
          if [ -z "$RAW" ]; then
            COMMIT_TIME="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          else
            COMMIT_TIME="$(date -u -d "$RAW" +%Y-%m-%dT%H:%M:%S.000Z)"
          fi
          echo "commit_time=${COMMIT_TIME}" >> "$GITHUB_OUTPUT"
          echo "Commit time (UTC): ${COMMIT_TIME}"

      # 提取 data.js 里所有 KP id，供 purge-stale 判断"该 id 在 data.js 里是否已有权威版"。
      # 只有两个条件都满足（updatedAt <= commit_time ∧ id ∈ dataJsIds）才算 stale。
      # 这保护 pure-add overlay（用户在编辑器加的 data.js 尚未收录的新 KP）永不被 purge。
      - name: Extract data.js KP ids
        id: ids
        run: |
          JSON=$(grep -oE '\{id:"k[0-9]+"' Main/data.js | grep -oE 'k[0-9]+' | sort -u \
            | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "count=$(echo "$JSON" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')" >> "$GITHUB_OUTPUT"
          # 大数组用文件传递，避免 github-output 单值长度限制
          echo "$JSON" > /tmp/data_js_ids.json
          echo "Extracted $(cat /tmp/data_js_ids.json | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))') KP ids from data.js"

      - name: Inject placeholders
        # index.html:       ?v=__SHA__ → ?v=<sha>            (cache-bust scripts URLs)
        # sw.js:            CACHE_VERSION = '__SHA__' → …     (force SW update on every deploy)
        # data_version.js:  __DEPLOY_TIME__ → <commit ISO>    (client uses this vs entry.updatedAt)
        run: |
          sed -i "s/__SHA__/${{ github.sha }}/g" Main/index.html
          sed -i "s/__SHA__/${{ github.sha }}/g" Main/sw.js
          sed -i "s/__DEPLOY_TIME__/${{ steps.ts.outputs.commit_time }}/g" Main/data_version.js

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message uses SHA (ASCII) to avoid CF Pages bug #11749
          # (long multi-line UTF-8 commit messages split multi-byte chars at byte 380)
          command: pages deploy Main --project-name=management-study --branch=main --commit-dirty=true --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }}

      - name: Deploy Worker
        # quiz-worker lives in Main/worker/. Deploys idempotent — wrangler no-ops if
        # source unchanged. Runs every push so purge-stale endpoint updates go live.
        # continue-on-error: even if the token lacks Workers permissions, client-side
        # timestamp compare in utils.js already makes stale overlays ineffective.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Main/worker
          command: deploy

      - name: Purge stale KV delta entries
        # Two-criterion purge: overlay stored before this commit AND id in this deploy's
        # data.js → safe to remove. Preserves pure-add overlays (new KP not yet in git)
        # and overlays saved during the deploy window (updatedAt > commit time).
        # Retry-with-backoff: when Worker code is redeployed, propagation to CF edge
        # nodes takes a few seconds. The first curl right after Deploy Worker can hit
        # an old edge still returning 404 for new endpoints. 5 retries up to ~30s
        # covers typical propagation time.
        # continue-on-error: even if all retries fail, Pages is already live and the
        # client-side timestamp compare still hides stale overlays.
        continue-on-error: true
        run: |
          BODY=$(python3 -c "
          import json
          ids = json.load(open('/tmp/data_js_ids.json'))
          print(json.dumps({
            'beforeTime': '${{ steps.ts.outputs.commit_time }}',
            'dataJsIds': ids,
          }))
          ")
          echo "Request body: ${#BODY} bytes, ${{ steps.ids.outputs.count }} ids, beforeTime=${{ steps.ts.outputs.commit_time }}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS -X POST "${WORKER_URL}/delta/kp/purge-stale" \
                -H "Authorization: Bearer ${WORKER_AUTH_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$BODY"; then
              echo ""
              echo "Purge complete (attempt ${attempt})."
              exit 0
            fi
            WAIT=$((2 ** (attempt - 1)))  # 1, 2, 4, 8, 16 seconds
            echo "Attempt ${attempt} failed, retrying in ${WAIT}s..."
            sleep "$WAIT"
          done
          echo "Purge failed after 5 attempts; giving up (continue-on-error)."
          exit 1
