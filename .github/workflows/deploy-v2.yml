name: Deploy v2 to Cloudflare Pages

# W1 完成后启用 push 自动触发（D1 已上线 + 数据已 sync）。
# 仍保留 workflow_dispatch 以便手动重跑。
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

# 防多次 push 触发并发 D1 sync 写 race（孤儿清理可能误删刚加的 KP）
# v0.4.6: 后端审查 #1 修
concurrency:
  group: deploy-v2-prod
  cancel-in-progress: false

jobs:
  deploy-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ========== 数据校验（CI gate，失败拒绝部署） ==========
      - name: Validate data
        run: pnpm validate

      - name: Run regression tests
        run: pnpm test

      # ========== Build Astro ==========
      - name: Build
        run: pnpm build
        env:
          PUBLIC_GIT_SHA: ${{ github.sha }}

      # ========== Sync D1 ==========
      # 生成 sync.sql 然后用 wrangler 执行
      - name: Generate D1 sync SQL
        run: pnpm sync:d1
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Apply D1 migrations (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: d1 migrations apply management-study-v2 --remote

      # v0.4.14 sync 拆 5 片避免 D1 1MB batch 上限 + workerd hash bug
      - name: Sync shard 01 meta+wipe
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: d1 execute management-study-v2 --remote --file=.wrangler/sync/01_meta_wipe.sql

      - name: Sync shard 02 KP
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: d1 execute management-study-v2 --remote --file=.wrangler/sync/02_kp.sql

      - name: Sync shard 03 KP joins
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: d1 execute management-study-v2 --remote --file=.wrangler/sync/03_kp_joins.sql

      - name: Sync shard 04 FTS
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: d1 execute management-study-v2 --remote --file=.wrangler/sync/04_fts.sql

      - name: Sync shard 05 log
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: d1 execute management-study-v2 --remote --file=.wrangler/sync/05_log.sql

      # ========== Deploy Pages ==========
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          # CF Pages 第一次部署会自动创建 project（如果不存在）
          command: pages deploy dist --project-name=management-study-v2 --branch=main --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }}
