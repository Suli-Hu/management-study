name: Deploy v2 to Cloudflare Pages

# v0.8.27 (2026-05-05) 重大策略变更 — code/data 严格分离
# ──────────────────────────────────────────────────────────────────
# Before: 每次 push 跑 sync:d1，用 git 的 v2/data/ 文件 upsert/wipe-reload D1。
# Problem: learning agents 通过 admin API 写入 D1 的数据 (新增 KP / school↔KP
#   关联 / KP body 编辑) 没机会全部 writeback 回 git，所以下一次 engineering
#   push 触发 sync 就把这些 D1 编辑覆盖回 git 的旧状态 — 静默数据丢失。
# After: GitHub Actions 只负责 code (Astro 网页 + D1 schema migrations)。
#   所有 content data (KP / scholar / school 内容 + 关联) 都通过 admin API
#   走 D1，永不再用 git 数据覆盖 D1。
# Recovery: 走 Cloudflare D1 Time Travel (默认 30 天 PITR)，不用手动 sync。
# ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

# 防多次 push 并发部署
concurrency:
  group: deploy-v2-prod
  cancel-in-progress: false

jobs:
  deploy-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ========== 数据校验（CI gate，失败拒绝部署） ==========
      - name: Validate data
        run: pnpm validate

      - name: Typecheck (v0.4.20 卡门：禁止类型漂移)
        run: pnpm typecheck

      - name: Run regression tests
        run: pnpm test

      # ========== Build Astro ==========
      - name: Build
        run: pnpm build
        env:
          PUBLIC_GIT_SHA: ${{ github.sha }}

      # ========== Apply D1 schema migrations (schema only, NO content) ==========
      # v0.8.27: schema migration 仍归 engineering — 创建 / 修改表结构是 code 的一部分。
      # content data (kp / scholar / school 行) 一律通过 admin API 走，不再用 git 覆盖。
      - name: Apply D1 migrations (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: d1 migrations apply management-study-v2 --remote

      # v0.8.27: REMOVED `Generate D1 sync SQL` + `Apply D1 sync shards` —
      #   见顶部 header 注释。脚本 (scripts/sync-to-d1.ts) 保留作冷启动 / 灾难恢复
      #   用，本地手动 `pnpm sync:d1` 仍可跑；但 CI workflow 不再自动调用。
      #   恢复路径：Cloudflare D1 Time Travel (默认 30 天 PITR)。

      # ========== Deploy Pages ==========
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          # CF Pages 第一次部署会自动创建 project（如果不存在）
          command: pages deploy dist --project-name=management-study-v2 --branch=main --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }}
